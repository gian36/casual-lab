<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>CL-01 Spike</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #131620;
        overflow: hidden;
        /* A WebView will happily let a finger scroll or long-press-select the page
           out from under a drag. Both have to be turned off explicitly; neither is
           a thing the native candidates have to think about. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
